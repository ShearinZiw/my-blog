baseURL: "https://blog.993123852.xyz/"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
title: "Shearin · 嵌入式知识库"
theme: PaperMod

pagination:
  pagerSize: 10

assetDir: "assets"
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Shearin · 嵌入式知识库"
  description: "从 C 工具链、MCU、RTOS、Linux 驱动到 lwIP：面向复习、项目追问与嵌入式岗位投递的知识库。"
  keywords: ["嵌入式", "C", "MCU", "RTOS", "Linux 驱动", "lwIP", "面试"]
  author: "Shearin"
  images: ["/og.png"]
  mainSections: ["posts"]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true

  assets:
    favicon: "/img/apple-touch-icon.jpg"
    favicon16x16: "/img/apple-touch-icon.jpg"
    favicon32x32: "/img/apple-touch-icon.jpg"
    apple_touch_icon: "/img/apple-touch-icon.jpg"
    safari_pinned_tab: "/img/apple-touch-icon.jpg"

  label:
    text: "嵌入式知识库"
    icon: "/img/apple-touch-icon.jpg"
    iconHeight: 35

  profileMode:
    enabled: true
    title: "嵌入式知识库"
    subtitle: "把八股放回工程现场：能复习，也能回答项目追问、定位真实故障。"
    imageUrl: "/img/68b0586671fcd944e44badb9279214990b7d23ec.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "Shearin"
    buttons:
      - name: "进入知识地图"
        url: "/posts/interview/"
      - name: "五条技术主干"
        url: "/posts/embedded/"
      - name: "全文搜索"
        url: "/search/"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.35
    minMatchCharLength: 2
    limit: 20
    keys: ["title", "permalink", "summary", "content"]

  toc:
    enable: true
    levels: ["h2", "h3", "h4"]

menu:
  main:
    - identifier: knowledge-map
      name: "知识地图"
      url: /posts/interview/
      weight: 10
    - identifier: embedded
      name: "五条主干"
      url: /posts/embedded/
      weight: 20
    - identifier: company
      name: "公司专题"
      url: /posts/company/
      weight: 30
    - identifier: search
      name: "搜索"
      url: /search/
      weight: 40
    - identifier: archives
      name: "归档"
      url: /archives/
      weight: 50
    - identifier: tags
      name: "标签"
      url: /tags/
      weight: 60

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    style: monokai
